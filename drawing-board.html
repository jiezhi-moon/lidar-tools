<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Drawing Board</title>
<style>
:root{font:15px -apple-system,BlinkMacSystemFont,sans-serif;color:#18202d;background:#f2f2f7}*{box-sizing:border-box}body{margin:0;height:100dvh;display:flex;flex-direction:column}button,select,input{font:inherit}button,select{min-height:42px;border:0;border-radius:9px;padding:8px 12px;background:#e7e9ee;color:inherit}button:disabled{opacity:.4}button.active,button.primary{background:#007aff;color:white}header{padding:8px max(10px,env(safe-area-inset-right)) 8px max(10px,env(safe-area-inset-left));background:#fafafc;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid #d8dbe1}header label{display:flex;align-items:center;gap:5px}input[type=range]{width:85px}input[type=color]{width:38px;height:38px;border:0;padding:0;background:none}#workspace{flex:1;min-height:60px;position:relative;overflow:hidden;touch-action:none;background:#dce0e6}canvas{position:absolute;inset:0;width:100%;height:100%}#paper{pointer-events:none}#ink{touch-action:none}footer{padding:7px max(12px,env(safe-area-inset-right)) max(7px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));font-size:12px;color:#5e6877;background:#fafafc}dialog{border:0;border-radius:18px;padding:22px;width:min(92vw,390px);box-shadow:0 10px 80px #0004}dialog::backdrop{background:#0005}dialog h2{margin:0 0 16px}dialog button,dialog select{width:100%;margin:5px 0}#startHint{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none;color:#687482}#startHint b{font-size:22px;color:#273242;margin-bottom:10px}#imageScale{display:none}input[type=file]{display:none}@media(max-width:600px){header{gap:5px;padding:6px}button,select{padding:7px 9px}#widthLabel span{display:none}input[type=range]{width:64px}}
</style></head><body>
<header aria-label="Drawing tools"><button id="new">New</button><button id="open">Import</button><select id="tool" aria-label="Tool"><option value="pen">Pen</option><option value="marker">Marker</option><option value="eraser">Eraser</option><option value="move">Move</option></select><input type="color" id="color" value="#18202d" aria-label="Stroke color"><label id="widthLabel"><span>Size</span><input id="width" type="range" min="1" max="40" value="6" aria-label="Stroke width"></label><button id="undo" disabled aria-label="Undo">↶</button><button id="redo" disabled aria-label="Redo">↷</button><button id="fit">Fit</button><button id="image">Image</button><label id="imageScale">Image size<input type="range" id="scaleImage" min="10" max="300" value="100"></label><button id="clear">Clear</button><button id="project">Project</button><button id="png" class="primary">PNG</button></header>
<main id="workspace"><canvas id="paper"></canvas><canvas id="ink" aria-label="Drawing canvas"></canvas><div id="startHint"><b>Drawing Board</b><span>Choose New to create a board, or Import to open an image or project.</span></div></main><footer id="status" role="status">Use two fingers to pan and zoom. Projects and images stay on this device.</footer>
<input id="openFile" type="file" accept="image/*,application/json,.json"><input id="imageFile" type="file" accept="image/*">
<dialog id="newDialog"><h2>New board</h2><select id="preset"><option value="1200,1200">Square · 1200 × 1200</option><option value="1200,1600">Portrait · 1200 × 1600</option><option value="1600,1200" selected>Landscape · 1600 × 1200</option><option value="1920,1080">Wide · 1920 × 1080</option><option value="infinite">Infinite board</option></select><button id="create" class="primary">Create</button><button id="cancelNew">Cancel</button></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id), paper=$('paper'),ink=$('ink'),workspace=$('workspace');
const state={width:1600,height:1200,infinite:false,open:false,strokes:[],image:null,zoom:1,x:0,y:0};
let undoStack=[],redoStack=[],stroke=null,gesture=null,frame=0,viewWidth=1,viewHeight=1,imageBitmap=null,imageSource=null,imageGeneration=0;
const pointers=new Map(),MAX_POINTS=150000,MAX_UNDO=30;
function status(text){$('status').textContent=text}
function snapshot(){return {strokes:state.strokes.slice(),image:state.image?{...state.image}:null}}
function saveUndo(){undoStack.push(snapshot());if(undoStack.length>MAX_UNDO)undoStack.shift();redoStack=[];buttons()}
function buttons(){$('undo').disabled=!undoStack.length;$('redo').disabled=!redoStack.length;$('startHint').style.display=state.open?'none':'grid';$('imageScale').style.display=state.image?'flex':'none'}
function restore(s){state.strokes=s.strokes;state.image=s.image;imageSource=null;render();buttons()}
function world(p){return {x:(p.x-state.x)/state.zoom,y:(p.y-state.y)/state.zoom}}
function local(e){const r=ink.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function fit(){state.zoom=Math.min(viewWidth/state.width,viewHeight/state.height)*.9;state.x=(viewWidth-state.width*state.zoom)/2;state.y=(viewHeight-state.height*state.zoom)/2;render()}
function createBoard(width,height,infinite=false){state.width=width;state.height=height;state.infinite=infinite;state.open=true;state.strokes=[];state.image=null;imageBitmap=null;imageSource=null;undoStack=[];redoStack=[];fit();buttons();status('Pen to draw · Move or two fingers to pan · Pinch to zoom')}
function drawStrokes(ctx,strokes){for(const s of strokes){ctx.globalCompositeOperation=s.tool==='eraser'?'destination-out':'source-over';ctx.globalAlpha=s.tool==='marker'?.35:1;ctx.strokeStyle=s.color;ctx.fillStyle=s.color;ctx.lineWidth=s.width;ctx.lineCap='round';ctx.lineJoin='round';if(s.points.length===1){ctx.beginPath();ctx.arc(s.points[0].x,s.points[0].y,s.width/2,0,Math.PI*2);ctx.fill()}else{ctx.beginPath();s.points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke()}}ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over'}
function updateBitmap(){if(!state.image){imageBitmap=null;imageSource=null;return}if(imageSource===state.image.data)return;imageSource=state.image.data;const generation=++imageGeneration,img=new Image();imageBitmap=null;img.onload=()=>{if(generation===imageGeneration){imageBitmap=img;render()}};img.onerror=()=>status('The image could not be opened.');img.src=imageSource}
function render(){if(frame)return;frame=requestAnimationFrame(()=>{frame=0;updateBitmap();for(const c of [paper,ink]){const ctx=c.getContext('2d');ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,c.width,c.height);ctx.save();ctx.setTransform(c.width/viewWidth,0,0,c.height/viewHeight,0,0);ctx.translate(state.x,state.y);ctx.scale(state.zoom,state.zoom);if(!state.infinite){ctx.beginPath();ctx.rect(0,0,state.width,state.height);ctx.clip()}if(c===paper){ctx.fillStyle='#fff';if(state.infinite){ctx.fillRect(-state.x/state.zoom,-state.y/state.zoom,viewWidth/state.zoom,viewHeight/state.zoom);ctx.strokeStyle='#e8ebef';ctx.lineWidth=1/state.zoom;const step=80,first=world({x:0,y:0}),last=world({x:viewWidth,y:viewHeight});ctx.beginPath();for(let x=Math.floor(first.x/step)*step;x<last.x;x+=step){ctx.moveTo(x,first.y);ctx.lineTo(x,last.y)}for(let y=Math.floor(first.y/step)*step;y<last.y;y+=step){ctx.moveTo(first.x,y);ctx.lineTo(last.x,y)}ctx.stroke()}else ctx.fillRect(0,0,state.width,state.height);if(state.image&&imageBitmap){const i=state.image;ctx.drawImage(imageBitmap,i.x,i.y,i.width,i.height)}}else drawStrokes(ctx,stroke?[...state.strokes,stroke]:state.strokes);ctx.restore()}})}
function resize(){viewWidth=Math.max(workspace.clientWidth,1);viewHeight=Math.max(workspace.clientHeight,1);const dpr=Math.min(devicePixelRatio||1,2,4096/viewWidth,4096/viewHeight);for(const c of [paper,ink]){c.width=Math.round(viewWidth*dpr);c.height=Math.round(viewHeight*dpr)}render()}
new ResizeObserver(resize).observe(workspace);
ink.addEventListener('pointerdown',e=>{if(!state.open)return;e.preventDefault();ink.setPointerCapture(e.pointerId);pointers.set(e.pointerId,local(e));if(pointers.size===2){stroke=null;const [a,b]=[...pointers.values()],mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};gesture={kind:'pinch',distance:Math.hypot(a.x-b.x,a.y-b.y),zoom:state.zoom,anchor:world(mid)};render();return}if(pointers.size>2)return;const p=world(local(e));if($('tool').value==='move'){if(state.image&&p.x>=state.image.x&&p.y>=state.image.y&&p.x<=state.image.x+state.image.width&&p.y<=state.image.y+state.image.height){saveUndo();gesture={kind:'image',start:p,image:{...state.image}}}else gesture={kind:'pan',start:local(e),x:state.x,y:state.y}}else{if(state.strokes.reduce((n,s)=>n+s.points.length,0)>=MAX_POINTS){status('This board is full. Save the project and start a new board.');return}gesture=null;stroke={tool:$('tool').value,color:$('color').value,width:Number($('width').value),points:[p]};render()}});
ink.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;e.preventDefault();pointers.set(e.pointerId,local(e));if(gesture?.kind==='pinch'&&pointers.size>=2){const[a,b]=[...pointers.values()],mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};state.zoom=Math.max(.05,Math.min(8,gesture.zoom*Math.hypot(a.x-b.x,a.y-b.y)/Math.max(gesture.distance,1)));state.x=mid.x-gesture.anchor.x*state.zoom;state.y=mid.y-gesture.anchor.y*state.zoom}else if(gesture?.kind==='pan'){const p=local(e);state.x=gesture.x+p.x-gesture.start.x;state.y=gesture.y+p.y-gesture.start.y}else if(gesture?.kind==='image'&&state.image){const p=world(local(e));state.image={...state.image,x:gesture.image.x+p.x-gesture.start.x,y:gesture.image.y+p.y-gesture.start.y}}else if(stroke&&stroke.points.length<20000){const p=world(local(e)),last=stroke.points.at(-1);if(Math.hypot(p.x-last.x,p.y-last.y)>.5)stroke.points.push(p)}render()});
function endPointer(e){pointers.delete(e.pointerId);if(e.type==='pointercancel')stroke=null;if(stroke&&pointers.size===0){saveUndo();state.strokes=[...state.strokes,stroke];stroke=null}if(pointers.size===0)gesture=null;render()}
ink.addEventListener('pointerup',endPointer);ink.addEventListener('pointercancel',endPointer);
ink.addEventListener('wheel',e=>{if(!state.open)return;e.preventDefault();const p=local(e),anchor=world(p);state.zoom=Math.max(.05,Math.min(8,state.zoom*Math.exp(-e.deltaY*.002)));state.x=p.x-anchor.x*state.zoom;state.y=p.y-anchor.y*state.zoom;render()},{passive:false});
async function imageData(file){if(file.size>32*1024*1024)throw Error('Choose an image smaller than 32 MB.');const url=URL.createObjectURL(file);try{const img=new Image();img.src=url;await img.decode();const scale=Math.min(1,2048/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*scale));c.height=Math.max(1,Math.round(img.naturalHeight*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);return{data:c.toDataURL('image/png'),width:c.width,height:c.height}}finally{URL.revokeObjectURL(url)}}
async function importImage(file,replace){const i=await imageData(file);if(replace||!state.open)createBoard(i.width,i.height);saveUndo();const scale=Math.min(1,state.width*.8/i.width,state.height*.8/i.height);state.image={...i,width:i.width*scale,height:i.height*scale,x:(state.width-i.width*scale)/2,y:(state.height-i.height*scale)/2};$('tool').value='move';$('scaleImage').value=100;render();buttons();status('Image imported. Select Move to reposition it. Save as Project to keep editing.')}
function validateProject(p){if(p?.format!=='lidar-drawing-board'||p.version!==1||!Number.isFinite(p.width)||!Number.isFinite(p.height)||p.width<1||p.height<1||p.width>4096||p.height>4096||typeof p.infinite!=='boolean'||!Array.isArray(p.strokes)||p.strokes.length>20000)throw Error('This is not a supported Drawing Board project.');let points=0;for(const s of p.strokes){if(!['pen','marker','eraser'].includes(s.tool)||!/^#[a-f0-9]{6}$/i.test(s.color)||!Number.isFinite(s.width)||s.width<1||s.width>40||!Array.isArray(s.points)||!s.points.length||s.points.length>20000)throw Error('Invalid stroke.');points+=s.points.length;for(const v of s.points){if(!Number.isFinite(v.x)||!Number.isFinite(v.y)||Math.abs(v.x)>1e6||Math.abs(v.y)>1e6)throw Error('Invalid drawing coordinates.')}}if(points>MAX_POINTS)throw Error('This project is too large.');if(p.image){const i=p.image;if(typeof i.data!=='string'||!i.data.startsWith('data:image/png;base64,')||i.data.length>12*1024*1024||![i.x,i.y,i.width,i.height].every(Number.isFinite)||i.width<=0||i.height<=0||Math.max(Math.abs(i.x),Math.abs(i.y),i.width,i.height)>1e6)throw Error('Invalid project image.')}return p}
async function openProject(file){if(file.size>20*1024*1024)throw Error('Choose a project smaller than 20 MB.');const p=validateProject(JSON.parse(await file.text()));createBoard(p.width,p.height,p.infinite);state.strokes=p.strokes;state.image=p.image||null;render();buttons();status('Editable project opened.')}
async function download(blob,name){if(blob.size>32*1024*1024)throw Error('The exported file is too large.');if(window.webkit?.messageHandlers?.toolExport){const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=reject;r.readAsDataURL(blob)});await window.webkit.messageHandlers.toolExport.postMessage({name,data})}else{const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}}
function exportRect(){if(!state.infinite)return{x:0,y:0,width:state.width,height:state.height};let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;for(const s of state.strokes)for(const p of s.points){minX=Math.min(minX,p.x-s.width);minY=Math.min(minY,p.y-s.width);maxX=Math.max(maxX,p.x+s.width);maxY=Math.max(maxY,p.y+s.width)}if(state.image){const i=state.image;minX=Math.min(minX,i.x);minY=Math.min(minY,i.y);maxX=Math.max(maxX,i.x+i.width);maxY=Math.max(maxY,i.y+i.height)}return Number.isFinite(minX)?{x:minX-20,y:minY-20,width:maxX-minX+40,height:maxY-minY+40}:{x:0,y:0,width:1200,height:1200}}
async function exportPNG(){if(!state.open)return;const r=exportRect(),scale=Math.min(1,4096/r.width,4096/r.height),out=document.createElement('canvas'),layer=document.createElement('canvas');out.width=layer.width=Math.max(1,Math.round(r.width*scale));out.height=layer.height=Math.max(1,Math.round(r.height*scale));const c=out.getContext('2d'),l=layer.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,out.width,out.height);for(const ctx of[c,l]){ctx.scale(scale,scale);ctx.translate(-r.x,-r.y)}if(state.image&&imageBitmap){const i=state.image;c.drawImage(imageBitmap,i.x,i.y,i.width,i.height)}drawStrokes(l,state.strokes);c.setTransform(1,0,0,1,0,0);c.drawImage(layer,0,0);const blob=await new Promise(resolve=>out.toBlob(resolve,'image/png'));if(!blob)throw Error('PNG export failed.');await download(blob,'Drawing.png');status('PNG ready to save or share.')}
function guarded(fn){return async()=>{try{await fn()}catch(e){status(e.message||String(e))}}}
$('new').onclick=()=>{if(!state.open||confirm('Create a new board? Save your current project first.'))$('newDialog').showModal()};$('cancelNew').onclick=()=>$('newDialog').close();$('create').onclick=()=>{const v=$('preset').value;const [w,h]=v==='infinite'?[1600,1200]:v.split(',').map(Number);createBoard(w,h,v==='infinite');$('newDialog').close()};$('fit').onclick=fit;$('undo').onclick=()=>{if(undoStack.length){redoStack.push(snapshot());restore(undoStack.pop())}};$('redo').onclick=()=>{if(redoStack.length){undoStack.push(snapshot());restore(redoStack.pop())}};
$('open').onclick=()=>$('openFile').click();$('image').onclick=()=>$('imageFile').click();$('openFile').onchange=guarded(async()=>{const f=$('openFile').files[0];if(f){if(f.name.toLowerCase().endsWith('.json'))await openProject(f);else await importImage(f,true)}$('openFile').value=''});$('imageFile').onchange=guarded(async()=>{const f=$('imageFile').files[0];if(f)await importImage(f,false);$('imageFile').value=''});
$('clear').onclick=()=>{if(state.open&&confirm('Clear all drawing strokes?')){saveUndo();state.strokes=[];render()}};$('project').onclick=guarded(async()=>{if(!state.open)return;await download(new Blob([JSON.stringify({format:'lidar-drawing-board',version:1,width:state.width,height:state.height,infinite:state.infinite,strokes:state.strokes,image:state.image})],{type:'application/json'}),'DrawingBoard.json');status('Editable project ready to save or share.')});$('png').onclick=guarded(exportPNG);
$('scaleImage').onchange=()=>{if(!state.image)return;saveUndo();const factor=Number($('scaleImage').value)/100,i=state.image;state.image={...i,x:i.x+i.width*(1-factor)/2,y:i.y+i.height*(1-factor)/2,width:i.width*factor,height:i.height*factor};$('scaleImage').value=100;render()};
window.addEventListener('error',e=>status(e.message));resize();buttons();
</script></body></html>
