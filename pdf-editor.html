<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PDF Editor</title><style>*{box-sizing:border-box}html{color-scheme:light dark}body{margin:0;font:15px -apple-system,BlinkMacSystemFont,sans-serif;background:light-dark(#f3f5f9,#11151f);color:light-dark(#182233,#eef3fc)}main{max-width:820px;margin:auto;padding:16px}button,input,select,textarea{font:inherit}button{border:1px solid #8999b144;border-radius:12px;padding:11px 14px;background:light-dark(white,#253144);color:inherit;min-height:44px}button:disabled{opacity:.4}.primary{background:#2563df;color:white}.danger{color:light-dark(#ba2535,#ff9aa7)}input,select,textarea{background:light-dark(white,#182233);color:inherit;border:1px solid #8999b155;border-radius:9px;padding:10px;max-width:100%;min-width:0}label{display:grid;gap:7px}h1{font-size:26px;margin:0 0 9px}h2{font-size:17px;margin:0 0 14px}.card{padding:18px;background:light-dark(white,#1a2231);border:1px solid #8999b122;border-radius:18px;margin-bottom:14px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:0 1 auto}.grow{flex:1!important}.muted{color:light-dark(#586579,#a6b5cc);font-size:13px;line-height:1.5}#status{min-height:22px;white-space:pre-wrap;overflow-wrap:anywhere}dialog{background:light-dark(white,#1a2231);color:inherit;border:1px solid #8999b144;border-radius:20px;max-width:calc(100% - 32px);width:420px;padding:22px}dialog::backdrop{background:#0008;backdrop-filter:blur(6px)}.toolbar{position:sticky;top:0;z-index:5;padding:12px;background:light-dark(#f3f5f9ee,#11151fee);backdrop-filter:blur(20px)}[hidden]{display:none!important}button:focus-visible,input:focus-visible{outline:3px solid #5599ff;outline-offset:2px}#viewport{overflow:auto;max-height:68vh;margin-top:12px}#sheet{position:relative;display:inline-block;width:100%;vertical-align:top}#page{display:block;width:100%;height:auto;background:white}#selection{position:absolute;background:#ffe80080;pointer-events:none}.note{display:block;width:100%;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0}textarea{width:100%}</style></head><body><div class="toolbar"><div class="row"><button id="import">Import</button><button id="new">New</button><button id="undo" disabled>Undo</button><button id="export" class="primary" disabled>Export PDF</button></div></div><main><div class="card"><div class="row"><button id="previous">‹</button><span id="pageLabel" class="grow">No document</span><button id="next">›</button><select id="mode" aria-label="Edit tool"><option value="view">View / Zoom</option><option value="text">Place text</option><option value="highlight">Highlight area</option></select></div><div id="textControls" hidden><label>Text<textarea id="text" rows="2" placeholder="Your text"></textarea></label><label>Font size<input id="size" type="number" value="18" min="8" max="96"></label></div><p id="hint" class="muted">Import a PDF or create a blank page.</p><div id="viewport"><div id="sheet" hidden><img id="page" alt="PDF page"><div id="selection" hidden></div></div></div></div><div class="card"><div class="row"><button id="rotate">Rotate</button><button id="earlier">Move earlier</button><button id="later">Move later</button><button id="deletePage" class="danger">Delete page</button><button id="clear" class="danger">Clear added annotations</button></div><h2 style="margin-top:18px">Text annotations</h2><div id="notes"></div></div><p class="muted">Export keeps the original PDF pages and adds editable annotations. The page preview is only a preview; it is not used to rebuild or flatten the document.</p><p id="status" role="status"></p></main><dialog id="confirm"><h2 id="confirmTitle"></h2><div class="row"><button id="cancelDelete">Cancel</button><button id="doDelete" class="danger">Delete</button></div></dialog><dialog id="noteEdit"><h2>Edit text</h2><textarea id="noteText" rows="4"></textarea><label>Font size<input id="noteSize" type="number" min="8" max="96"></label><div class="row"><button id="closeNote">Cancel</button><button id="saveNote" class="primary">Save</button><button id="deleteNote" class="danger">Delete</button></div></dialog><script>const $=id=>document.getElementById(id);let state={};async function send(command,extra={}){try{const b=window.webkit?.messageHandlers?.deviceFile;if(!b)throw Error('Open this download in the updated Leisure Box app.');const result=await b.postMessage({command,...extra});if(result)receiveDeviceState(result)}catch(e){$('status').textContent=e.message||String(e)}};let pending,annotation=-1,startPoint=null;window.receiveDeviceState=s=>{state=s;const has=s.pageCount>0;$('sheet').hidden=!has;$('pageLabel').textContent=has?'Page '+(s.pageIndex+1)+' / '+s.pageCount:'No document';if(s.image&&$('page').getAttribute('src')!==s.image)$('page').src=s.image;$('previous').disabled=!has||s.pageIndex===0;$('next').disabled=!has||s.pageIndex===s.pageCount-1;$('undo').disabled=!s.canUndo||s.busy;for(const id of ['export','rotate','earlier','later','clear','deletePage','mode'])$(id).disabled=!has||s.busy;$('deletePage').disabled=!has||s.pageCount<2||s.busy;$('status').textContent=s.status||'';$('notes').replaceChildren();for(const a of s.annotations||[]){const button=document.createElement('button');button.textContent=a.text||'(empty text)';button.className='note';button.onclick=()=>{annotation=a.index;$('noteText').value=a.text;$('noteSize').value=a.size;$('noteEdit').showModal()};$('notes').append(button)}};function ask(command,text){pending=command;$('confirmTitle').textContent=text;$('confirm').showModal()}$('doDelete').onclick=()=>{$('confirm').close();send(pending)};$('cancelDelete').onclick=()=>$('confirm').close();$('import').onclick=()=>send('import');$('new').onclick=()=>state.pageCount?ask('new','Replace the open document with a new blank page?'):send('new');$('undo').onclick=()=>send('undo');$('export').onclick=()=>send('export');$('previous').onclick=()=>send('page',{index:state.pageIndex-1});$('next').onclick=()=>send('page',{index:state.pageIndex+1});$('rotate').onclick=()=>send('rotate');$('earlier').onclick=()=>send('move',{offset:-1});$('later').onclick=()=>send('move',{offset:1});$('deletePage').onclick=()=>ask('deletePage','Delete this page?');$('clear').onclick=()=>ask('clearNotes','Clear all annotations added by Leisure Box on this page?');$('saveNote').onclick=()=>{$('noteEdit').close();send('updateNote',{index:annotation,text:$('noteText').value,size:Number($('noteSize').value)})};$('deleteNote').onclick=()=>{$('noteEdit').close();annotation>=0&&send('deleteNote',{index:annotation})};$('closeNote').onclick=()=>$('noteEdit').close();$('mode').onchange=()=>{$('textControls').hidden=$('mode').value!=='text';$('sheet').style.touchAction=$('mode').value==='view'?'auto':'none';$('hint').textContent=$('mode').value==='text'?'Tap the page to place text.':$('mode').value==='highlight'?'Drag across an area to highlight it.':'Pinch to zoom the page.'};function point(e){const r=$('page').getBoundingClientRect();return{x:Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y:Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))}}$('sheet').onpointerdown=e=>{if(e.isPrimary&&$('mode').value!=='view'){startPoint=point(e);$('sheet').setPointerCapture(e.pointerId)}};$('sheet').onpointermove=e=>{if(!startPoint||$('mode').value!=='highlight')return;const p=point(e),r=$('selection');r.hidden=false;r.style.left=Math.min(startPoint.x,p.x)*100+'%';r.style.top=Math.min(startPoint.y,p.y)*100+'%';r.style.width=Math.abs(p.x-startPoint.x)*100+'%';r.style.height=Math.abs(p.y-startPoint.y)*100+'%'};$('sheet').onpointerup=e=>{if(!startPoint)return;const p=point(e),a=startPoint;startPoint=null;$('selection').hidden=true;if($('mode').value==='text'){if(!$('text').value.trim()){$('status').textContent='Enter text first.';return}send('text',{x:p.x,y:p.y,width:Math.min(.6,1-p.x),height:Math.min(.16,1-p.y),text:$('text').value,size:Number($('size').value)})}else if(Math.abs(a.x-p.x)>.005&&Math.abs(a.y-p.y)>.005)send('highlight',{x:Math.min(a.x,p.x),y:Math.min(a.y,p.y),width:Math.abs(a.x-p.x),height:Math.abs(a.y-p.y)})};$('sheet').onpointercancel=()=>{startPoint=null;$('selection').hidden=true};send('state');</script></body></html>
