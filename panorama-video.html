<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>360° Video Viewer</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0d11;color:#fff;font:15px -apple-system,BlinkMacSystemFont,sans-serif;height:100dvh;display:flex;flex-direction:column}button,input{font:inherit}button{border:0;background:#2b303b;color:#fff;min-height:44px;border-radius:10px;padding:8px 13px}button.primary{background:#0a84ff}header,footer{padding:10px max(12px,env(safe-area-inset-right)) 10px max(12px,env(safe-area-inset-left));display:flex;align-items:center;gap:10px;flex-wrap:wrap}header strong{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#stage{position:relative;flex:1;min-height:80px;overflow:hidden;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}#hint{position:absolute;inset:0;display:grid;place-content:center;gap:12px;text-align:center;pointer-events:none;padding:30px;color:#a9b2c2}#hint b{color:#fff;font-size:25px}footer{padding-bottom:max(10px,env(safe-area-inset-bottom));background:#141820}#seek{min-width:60px;flex:1;accent-color:#0a84ff}#time{font:12px ui-monospace,monospace;color:#c5ccda}#status{width:100%;font-size:12px;color:#a9b2c2}input[type=file],video{display:none}#stage:fullscreen{background:#000}#stage:fullscreen #hint{display:none}
</style></head><body><header><button id="choose" class="primary">Choose Video</button><strong id="name">360° Video Viewer</strong><button id="reset">Reset View</button><button id="full">Full Screen</button></header><main id="stage"><canvas id="view" aria-label="360 degree video. Drag to look around and pinch to zoom."></canvas><div id="hint"><b>Look around your video</b><span>Choose an equirectangular 360° video.</span><span>Drag to look around · Pinch to zoom</span></div></main><footer><button id="play" disabled>Play</button><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Video position" disabled><span id="time">0:00 / 0:00</span><button id="mute">Sound On</button><span id="status" role="status">Videos play locally. No upload required.</span></footer><input id="file" type="file" accept="video/*,.mp4,.mov,.m4v,.webm"><video id="video" playsinline webkit-playsinline preload="metadata" loop></video>
<script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('view'),video=$('video'),stage=$('stage');let gl=null,program=null,texture=null,url=null,yaw=0,pitch=0,fov=75,animation=0,playing=false,pinch=null,ready=false;
const pointers=new Map();function status(s){$('status').textContent=s}
function initGL(){gl=canvas.getContext('webgl',{alpha:false,antialias:false,preserveDrawingBuffer:false});if(!gl)throw Error('360° rendering is unavailable on this device.');const vertex='attribute vec2 position; varying vec2 screen; void main(){screen=position;gl_Position=vec4(position,0.,1.);}';const fragment=`precision highp float; varying vec2 screen; uniform sampler2D movie; uniform float aspect; uniform float angle; uniform float yaw; uniform float pitch;
void main(){vec3 ray=normalize(vec3(screen.x*aspect*tan(angle/2.),screen.y*tan(angle/2.),-1.));float cp=cos(pitch),sp=sin(pitch);ray=vec3(ray.x,cp*ray.y-sp*ray.z,sp*ray.y+cp*ray.z);float cy=cos(yaw),sy=sin(yaw);ray=vec3(cy*ray.x-sy*ray.z,ray.y,sy*ray.x+cy*ray.z);vec2 uv=vec2(atan(ray.x,-ray.z)/6.28318530718+.5,acos(clamp(ray.y,-1.,1.))/3.14159265359);gl_FragColor=texture2D(movie,uv);}`;
function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error('360° video shader could not start.');return s}program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vertex));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fragment));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error('360° renderer could not start.');gl.useProgram(program);const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);const a=gl.getAttribLocation(program,'position');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);texture=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,texture);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([11,13,17,255]));gl.uniform1i(gl.getUniformLocation(program,'movie'),0);resize()}
function resize(){const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.max(1,Math.min(2560,Math.round(stage.clientWidth*dpr)));canvas.height=Math.max(1,Math.min(2560,Math.round(stage.clientHeight*dpr)));if(gl){gl.viewport(0,0,canvas.width,canvas.height);render()}}
function render(){if(!gl||!program||!ready)return;gl.useProgram(program);gl.uniform1f(gl.getUniformLocation(program,'aspect'),canvas.width/canvas.height);gl.uniform1f(gl.getUniformLocation(program,'angle'),fov*Math.PI/180);gl.uniform1f(gl.getUniformLocation(program,'yaw'),yaw);gl.uniform1f(gl.getUniformLocation(program,'pitch'),pitch);gl.bindTexture(gl.TEXTURE_2D,texture);if(video.readyState>=2){try{gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,video)}catch(e){video.pause();status('This video cannot be rendered. Try an H.264 MP4 file.');return}}gl.drawArrays(gl.TRIANGLES,0,3)}
function tick(){animation=0;render();if(!video.paused&&!video.ended)animation=requestAnimationFrame(tick)}
function time(s){if(!Number.isFinite(s))return'0:00';return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')}
function cleanup(){video.pause();if(animation)cancelAnimationFrame(animation);animation=0;ready=false;video.removeAttribute('src');video.load();if(url)URL.revokeObjectURL(url);url=null;$('play').disabled=true;$('seek').disabled=true}
async function loadVideo(file){cleanup();if(!file)return;if(!gl)initGL();url=URL.createObjectURL(file);video.src=url;video.load();$('name').textContent=file.name;$('hint').style.display='none';status('Loading video…');yaw=pitch=0;fov=75}
$('choose').onclick=()=>$('file').click();$('file').onchange=async()=>{try{await loadVideo($('file').files[0])}catch(e){status(e.message)}$('file').value=''};
video.onloadeddata=()=>{if(video.videoWidth>gl.getParameter(gl.MAX_TEXTURE_SIZE)||video.videoHeight>gl.getParameter(gl.MAX_TEXTURE_SIZE)){cleanup();status('This video is too large for the device GPU. Try a lower resolution.');return}ready=true;$('play').disabled=false;$('seek').disabled=false;render();status('Ready · Drag to look around · Pinch to zoom')};
video.onerror=()=>{ready=false;$('play').disabled=true;$('seek').disabled=true;status('The video format is unsupported or the file is damaged. Try an H.264 MP4 file.');$('hint').style.display='grid'};video.ontimeupdate=()=>{$('seek').value=Number.isFinite(video.duration)?Math.round(video.currentTime/video.duration*1000):0;$('time').textContent=time(video.currentTime)+' / '+time(video.duration)};
video.onplay=()=>{$('play').textContent='Pause';if(!animation)animation=requestAnimationFrame(tick)};video.onpause=()=>{$('play').textContent='Play';if(animation)cancelAnimationFrame(animation);animation=0};video.onseeked=render;
$('play').onclick=async()=>{try{if(video.paused)await video.play();else video.pause()}catch(e){status('Playback could not start: '+e.message)}};$('seek').oninput=()=>{if(Number.isFinite(video.duration))video.currentTime=video.duration*Number($('seek').value)/1000};$('mute').onclick=()=>{video.muted=!video.muted;$('mute').textContent=video.muted?'Sound Off':'Sound On'};$('reset').onclick=()=>{yaw=pitch=0;fov=75;render()};
$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(stage.requestFullscreen)await stage.requestFullscreen();else status('Rotate your phone for a wider view.')}catch(e){status('Rotate your phone for a wider view.')}};
canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){const[a,b]=[...pointers.values()];pinch={distance:Math.hypot(a.x-b.x,a.y-b.y),fov}}};canvas.onpointermove=e=>{const old=pointers.get(e.pointerId);if(!old)return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size>=2&&pinch){const[a,b]=[...pointers.values()];fov=Math.max(30,Math.min(110,pinch.fov*pinch.distance/Math.max(1,Math.hypot(a.x-b.x,a.y-b.y))))}else{yaw-=(e.clientX-old.x)*.005;pitch=Math.max(-Math.PI/2+.02,Math.min(Math.PI/2-.02,pitch+(e.clientY-old.y)*.005))}render()};function end(e){pointers.delete(e.pointerId);if(pointers.size<2)pinch=null}canvas.onpointerup=end;canvas.onpointercancel=end;canvas.addEventListener('wheel',e=>{e.preventDefault();fov=Math.max(30,Math.min(110,fov+e.deltaY*.04));render()},{passive:false});
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();video.pause();ready=false;status('Graphics resources were released. Reopen this tool to continue.')});document.addEventListener('visibilitychange',()=>{if(document.hidden)video.pause()});window.addEventListener('pagehide',cleanup);new ResizeObserver(resize).observe(stage);try{initGL()}catch(e){status(e.message);$('choose').disabled=true}
</script></body></html>
