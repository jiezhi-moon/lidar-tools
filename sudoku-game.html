<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sudoku</title><style>*{box-sizing:border-box}html{color-scheme:light dark}body{margin:0;font:15px -apple-system,BlinkMacSystemFont,sans-serif;background:light-dark(#f3f5f9,#11151f);color:light-dark(#182233,#eef3fc)}main{max-width:820px;margin:auto;padding:16px}button,input,select,textarea{font:inherit}button{border:1px solid #8999b144;border-radius:12px;padding:11px 14px;background:light-dark(white,#253144);color:inherit;min-height:44px}button:disabled{opacity:.4}.primary{background:#2563df;color:white}.danger{color:light-dark(#ba2535,#ff9aa7)}input,select,textarea{background:light-dark(white,#182233);color:inherit;border:1px solid #8999b155;border-radius:9px;padding:10px;max-width:100%;min-width:0}label{display:grid;gap:7px}h1{font-size:26px;margin:0 0 9px}h2{font-size:17px;margin:0 0 14px}.card{padding:18px;background:light-dark(white,#1a2231);border:1px solid #8999b122;border-radius:18px;margin-bottom:14px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:0 1 auto}.grow{flex:1!important}.muted{color:light-dark(#586579,#a6b5cc);font-size:13px;line-height:1.5}#status{min-height:22px;white-space:pre-wrap;overflow-wrap:anywhere}dialog{background:light-dark(white,#1a2231);color:inherit;border:1px solid #8999b144;border-radius:20px;max-width:calc(100% - 32px);width:420px;padding:22px}dialog::backdrop{background:#0008;backdrop-filter:blur(6px)}.toolbar{position:sticky;top:0;z-index:5;padding:12px;background:light-dark(#f3f5f9ee,#11151fee);backdrop-filter:blur(20px)}[hidden]{display:none!important}button:focus-visible,input:focus-visible{outline:3px solid #5599ff;outline-offset:2px}main{max-width:620px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.top h1{margin:0}#grid{display:grid;grid-template-columns:repeat(9,1fr);border:2px solid #7182a1;border-radius:8px;overflow:hidden;aspect-ratio:1}.cell{border:0;border-right:1px solid #8999b155;border-bottom:1px solid #8999b155;border-radius:0;padding:0;min-height:0;aspect-ratio:1;font-size:clamp(19px,5vw,29px);color:light-dark(#2162da,#89b4ff);background:light-dark(#fff,#1b2537)}.cell.fixed{font-weight:700;color:light-dark(#172239,#f1f5ff)}.cell.related{background:light-dark(#eaf1fb,#253348)}.cell.selected{background:light-dark(#c9e0ff,#2f5181);box-shadow:inset 0 0 0 2px #5491e4}.cell.wrong{color:light-dark(#ca2637,#ff8999);background:light-dark(#ffe8ec,#512b38)}.pencil{display:grid;grid-template-columns:repeat(3,1fr);font-size:clamp(8px,2.4vw,12px);line-height:1.2;width:100%;height:100%;align-items:center}.pencil span{display:block}#numbers{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin:14px 0}#numbers button{padding:10px 0;font-size:21px}.active{background:#2563df;color:white}#time{font-variant-numeric:tabular-nums}#status{margin-bottom:0}</style></head><body><main><div class="top"><h1>Sudoku</h1><span id="time">00:00</span></div><div class="row" style="margin-bottom:14px"><label class="grow">Difficulty<select id="difficulty"><option value="0">Easy</option><option value="1">Medium</option><option value="2">Hard</option></select></label><button id="new">New</button></div><div id="grid" role="group" aria-label="Sudoku board"></div><div id="numbers" aria-label="Number pad"></div><div class="row"><button id="notes" aria-pressed="false">Notes</button><button id="erase">Erase</button><button id="undo">Undo</button><button id="hint">Hint</button><button id="check">Check</button></div><p id="status" role="status">Loading…</p><p class="muted">Select a cell, then a number. Notes toggles small candidate numbers. Each puzzle has exactly one solution.</p></main><dialog id="confirm"><h2>Start a new puzzle?</h2><p>Your current puzzle will be replaced.</p><div class="row"><button id="cancelNew">Keep playing</button><button id="confirmNew" class="primary">New puzzle</button></div></dialog><script>const $=id=>document.getElementById(id),KEY='sudoku-game-v1';
const storage={get(){try{return window.leisureStorage?leisureStorage.getItem(KEY):localStorage.getItem(KEY)}catch{return null}},set(value){try{if(window.leisureStorage)leisureStorage.setItem(KEY,value);else localStorage.setItem(KEY,value)}catch{$('status').textContent='Unable to save progress. Keep this page open.'}}};
function peers(i,j){return Math.floor(i/9)===Math.floor(j/9)||i%9===j%9||(Math.floor(i/27)===Math.floor(j/27)&&Math.floor(i%9/3)===Math.floor(j%9/3))}
function candidates(board,i){if(board[i])return[];const taken=new Set(board.filter((_,j)=>peers(i,j)));return[1,2,3,4,5,6,7,8,9].filter(n=>!taken.has(n))}
function countSolutions(input,limit=2){let count=0,b=input.slice(),nodes=0;function visit(){if(++nodes>200000)return;if(count>=limit)return;let at=-1,choices;for(let i=0;i<81;i++)if(!b[i]){const c=candidates(b,i);if(!c.length)return;if(!choices||c.length<choices.length){at=i;choices=c;if(c.length===1)break}}if(at<0){count++;return}for(const n of choices){b[at]=n;visit();b[at]=0;if(count>=limit)return}}visit();return nodes>200000?-1:count}
function generatePuzzle(difficulty){const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};const rows=shuffle([0,1,2]).flatMap(b=>shuffle([0,1,2]).map(r=>b*3+r)),cols=shuffle([0,1,2]).flatMap(b=>shuffle([0,1,2]).map(c=>b*3+c)),nums=shuffle([1,2,3,4,5,6,7,8,9]);const solution=rows.flatMap(r=>cols.map(c=>nums[(r*3+Math.floor(r/3)+c)%9])),clues=solution.slice(),target=[38,32,27][difficulty]||38;let left=81;for(const i of shuffle(Array.from({length:81},(_,i)=>i))){if(left<=target)break;const n=clues[i];clues[i]=0;if(countSolutions(clues)===1)left--;else clues[i]=n}return{clues,solution}}
let puzzle,board=[],notes=Array(81).fill(0),history=[],selected=-1,noteMode=false,checkMode=false,seconds=0,worker=null,busy=false,token=0;
const complete=()=>puzzle&&board.every((v,i)=>v===puzzle.solution[i]);
function save(){if(puzzle)storage.set(JSON.stringify({schemaVersion:1,puzzle,board,notes,history:history.slice(-200),difficulty:Number($('difficulty').value),seconds}))}
function checkpoint(){history.push({board:board.slice(),notes:notes.slice()});if(history.length>200)history.shift()}
function validBoard(a){return Array.isArray(a)&&a.length===81&&a.every(x=>Number.isInteger(x)&&x>=0&&x<=9)}
function restore(){try{const s=JSON.parse(storage.get());if(!s||s.schemaVersion!==1||!validBoard(s.board)||!validBoard(s.puzzle?.clues)||!validBoard(s.puzzle?.solution)||s.puzzle.solution.includes(0)||countSolutions(s.puzzle.solution,1)!==1||s.puzzle.solution.some((v,i)=>s.puzzle.solution.some((n,j)=>i!==j&&n===v&&peers(i,j)))||s.puzzle.clues.some((v,i)=>v&&(v!==s.puzzle.solution[i]||s.board[i]!==v))||!Array.isArray(s.notes)||s.notes.length!==81||!s.notes.every(x=>Number.isInteger(x)&&x>=0&&x<=511))return false;puzzle=s.puzzle;board=s.board;notes=s.notes;seconds=Math.max(0,Number.isFinite(s.seconds)?Math.floor(s.seconds):0);$('difficulty').value=String(Math.max(0,Math.min(2,s.difficulty||0)));history=(s.history||[]).filter(h=>validBoard(h.board)&&Array.isArray(h.notes)&&h.notes.length===81&&h.notes.every(n=>Number.isInteger(n)&&n>=0&&n<=511)&&puzzle.clues.every((n,i)=>!n||n===h.board[i])).slice(-200);return true}catch{return false}}
function render(){const grid=$('grid');grid.replaceChildren();for(let i=0;i<81;i++){const b=document.createElement('button');b.className='cell'+(puzzle?.clues[i]?' fixed':'')+(selected===i?' selected':selected>=0&&peers(i,selected)?' related':'')+(checkMode&&board[i]&&board[i]!==puzzle?.solution[i]?' wrong':'');b.style.borderRightWidth=(i%9===2||i%9===5)?'2px':'1px';b.style.borderBottomWidth=(Math.floor(i/9)===2||Math.floor(i/9)===5)?'2px':'1px';b.setAttribute('aria-label','Row '+(Math.floor(i/9)+1)+', column '+(i%9+1)+(board[i]?', '+board[i]:', empty'));if(board[i])b.textContent=board[i];else{const n=document.createElement('span');n.className='pencil';for(let k=1;k<=9;k++){const x=document.createElement('span');x.textContent=(notes[i]&(1<<(k-1)))?k:'';n.append(x)}b.append(n)}b.onclick=()=>{selected=i;render()};b.disabled=busy;grid.append(b)}$('undo').disabled=!history.length||busy;$('erase').disabled=busy||selected<0||!!puzzle?.clues[selected]||complete();$('hint').disabled=busy||complete();$('notes').classList.toggle('active',noteMode);$('notes').setAttribute('aria-pressed',String(noteMode));for(const b of $('numbers').children)b.disabled=busy||selected<0||!!puzzle?.clues[selected]||complete();$('new').disabled=busy;$('difficulty').disabled=busy;$('check').disabled=busy;$('time').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');if(complete())$('status').textContent='Solved! Choose New for another puzzle.'}
function enter(n){if(busy||selected<0||!puzzle||puzzle.clues[selected]||complete())return;checkpoint();if(noteMode&&n){notes[selected]^=1<<(n-1);board[selected]=0}else{board[selected]=n;notes[selected]=0;if(n)for(let i=0;i<81;i++)if(peers(i,selected))notes[i]&=~(1<<(n-1))}checkMode=false;save();render()}
function newPuzzle(){if(worker)worker.terminate();busy=true;const current=++token;$('status').textContent='Creating a uniquely solvable puzzle…';render();const script=peers.toString()+';'+candidates.toString()+';'+countSolutions.toString()+';'+generatePuzzle.toString()+';onmessage=e=>{try{postMessage({puzzle:generatePuzzle(e.data)})}catch(error){postMessage({error:String(error)})}}';const blob=URL.createObjectURL(new Blob([script],{type:'text/javascript'}));try{worker=new Worker(blob)}catch(e){busy=false;$('status').textContent='Unable to start puzzle generator: '+e.message;render();URL.revokeObjectURL(blob);return}URL.revokeObjectURL(blob);const timeout=setTimeout(()=>{if(current!==token||!busy)return;worker.terminate();busy=false;$('status').textContent='Generation timed out. Tap New to retry.';render()},20000);worker.onmessage=e=>{clearTimeout(timeout);if(current!==token)return;worker.terminate();worker=null;busy=false;if(e.data.error){$('status').textContent=e.data.error;render();return}puzzle=e.data.puzzle;board=puzzle.clues.slice();notes=Array(81).fill(0);history=[];selected=-1;seconds=0;checkMode=false;$('status').textContent='Select a cell, then choose a number.';save();render()};worker.onerror=e=>{clearTimeout(timeout);busy=false;$('status').textContent='Could not generate a puzzle. Tap New to retry.';render()};worker.postMessage(Number($('difficulty').value))}
for(let n=1;n<=9;n++){const b=document.createElement('button');b.textContent=n;b.onclick=()=>enter(n);$('numbers').append(b)}$('notes').onclick=()=>{noteMode=!noteMode;render()};$('erase').onclick=()=>enter(0);$('undo').onclick=()=>{const h=history.pop();if(h){board=h.board;notes=h.notes;checkMode=false;save();render()}};$('hint').onclick=()=>{if(busy||complete())return;const i=selected>=0&&!puzzle.clues[selected]&&board[selected]!==puzzle.solution[selected]?selected:board.findIndex((n,i)=>n!==puzzle.solution[i]);if(i<0)return;selected=i;const old=noteMode;noteMode=false;enter(puzzle.solution[i]);noteMode=old;render();$('status').textContent='Hint filled the highlighted cell.'};$('check').onclick=()=>{checkMode=true;$('status').textContent=complete()?'Solved!':board.some((n,i)=>n&&n!==puzzle.solution[i])?'Highlighted entries need another look.':'So far, so good.';render()};$('new').onclick=()=>puzzle?$('confirm').showModal():newPuzzle();$('cancelNew').onclick=()=>$('confirm').close();$('confirmNew').onclick=()=>{$('confirm').close();newPuzzle()};document.addEventListener('keydown',e=>{if(!$('confirm').open&&selected>=0){if(/^[1-9]$/.test(e.key)){e.preventDefault();enter(Number(e.key))}else if(e.key==='Backspace'||e.key==='Delete'){e.preventDefault();enter(0)}}});setInterval(()=>{if(!document.hidden&&!busy&&puzzle&&!complete()&&!$('confirm').open){seconds++;$('time').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');if(seconds%5===0)save()}},1000);window.addEventListener('pagehide',save);if(restore())render();else newPuzzle();
</script></body></html>
